<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-card">

 <div class="floating icon"></div>

 <div class="current-weather">
    <h1>London</h1>
    <p class="Temperature"> 22 degrees celcius</p>
    <p class="condition">Partly Cloudy</p>
 </div>

 <div class="forecast-section">
    <h3>Weekly Forecast</h3>
    <div class=" forecast-grid">
        <div class="day"><span>Mon</span><span></span> 20 degrees celcius</span>/div>
        <div class="day"><span>Tue</span><span></span>17 degrees celcius </span>/div>
        <div class="day"><span>Wed</span><span></span>23 degrees celcius </span>/div>
        <div class="day"><span>Thu</span><span></span>16 degrees celcius </span>/div>
        <div class="day"><span>Fri</span><span></span>19 degrees celcius </span>/div>
    </div>
 </div>
    
    
</body>
</html>
